<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikoShop | Product Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="list.html">
            <span class="brand-mark">B</span>
            <span><strong>Biko<span>Shop</span></strong><small>PRODUCT MANAGEMENT</small></span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="list.html">Products</a>
        </nav>
    </header>

    <main class="container">
        <section class="page-heading">
            <div>
                <p class="eyebrow">BIKOSHOP MANAGEMENT</p>
                <h1 id="form-title">Add Product</h1>
                <p>Enter the product details below.</p>
            </div>
        </section>

        <section class="panel form-panel">
            <form id="product-form" class="product-form">
                <input type="hidden" id="product-id" name="product_id">

                <div class="field">
                    <label for="product-name">Product Name <span>*</span></label>
                    <input type="text" id="product-name" name="product_name"
                           maxlength="100" placeholder="e.g. Classic Biko Slice" required>
                </div>

                <div class="field">
                    <label for="category-id">Category <span>*</span></label>
                    <select id="category-id" name="category_id" required>
                        <option value="">Choose a category</option>
                        <option value="1">Classic Biko</option>
                        <option value="2">Flavored Biko</option>
                        <option value="3">Biko Box</option>
                        <option value="4">Gift Package</option>
                    </select>
                </div>

                <div class="field field-full">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4"
                              placeholder="Write a short product description..."></textarea>
                </div>

                <div class="field">
                    <label for="unit-price">Unit Price (₱) <span>*</span></label>
                    <input type="number" id="unit-price" name="unit_price"
                           min="0" step="0.01" placeholder="0.00" required>
                </div>

                <div class="form-actions field-full">
                    <button type="submit" class="btn btn-gold">Save Product</button>
                    <a href="list.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </section>
        <p class="page-note">BikoShop · Product Management Prototype</p>
    </main>
</body>
</html>
